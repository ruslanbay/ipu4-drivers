# Surface Book 3 / Surface Pro 7 Intel IPU4P WirePlumber rules:
# 1. Hide raw Bayer / Y10 CSI-2 ISYS capture nodes (/dev/video0..31) and
#    v4l-subdev nodes from WirePlumber's V4L2 monitor so apps don't see 32
#    unusable raw DMA endpoints.
# 2. Give the 3 native libcamera nodes distinct human-readable names and session
#    priorities so Front RGB (OV5693) is always the default webcam ahead of
#    Rear RGB (OV8865) and Front IR (OV7251).

monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.pci-0000_00_05.0.*" }
      { api.v4l2.cap.card = "ipu4p" }
      { api.v4l2.cap.driver = "isys" }
      { api.v4l2.path = "~.*/v4l-subdev[0-9]+$" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
]

monitor.libcamera.rules = [
  {
    matches = [
      { node.name = "~.*I2C2\\.CAMF" }
    ]
    actions = {
      update-props = {
        node.description = "Surface Front Camera"
        node.nick = "Surface Front Camera"
        priority.session = 850
      }
    }
  },
  {
    matches = [
      { node.name = "~.*I2C3\\.CAMR" }
    ]
    actions = {
      update-props = {
        node.description = "Surface Rear Camera"
        node.nick = "Surface Rear Camera"
        priority.session = 750
      }
    }
  },
  {
    matches = [
      { node.name = "~.*I2C3\\.CAM3" }
    ]
    actions = {
      update-props = {
        node.description = "Surface Front IR Camera"
        node.nick = "Surface Front IR Camera"
        priority.session = 650
      }
    }
  }
]
